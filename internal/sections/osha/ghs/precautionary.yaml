# GHS precautionary statements, transcribed from 29 CFR 1910.1200 Appendix C.
#
# REVIEW REQUIRED: reference data for a document with legal and safety weight.
#
# supplier_specified: true marks a statement whose regulatory text contains
# manufacturer-chosen wording (a slash-list to trim, or bracketed text). The
# generic text below is emitted verbatim unless the document overrides it via
# precautionary_text, and `document classify` reports every unfilled one.
#
# Combination statements (P305+P351+P338) are single entries and are never split.
