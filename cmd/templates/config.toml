# sdsforge configuration.
#
# Everything here is the same on every sheet you produce, which is why it lives
# in one file instead of in each document. Fill in [company] and
# [[emergency.contacts]] once and section 1 is written for you from then on.

[library]
# Which built-in content library to draw section wording from.
# Only "osha" ships today.
jurisdiction = "osha"

# Turn on your own content library, layered over the built-in one.
# When false, custom_dir is neither read nor scanned.
custom_variants = false

# Root of that library. It holds a jurisdiction directory, e.g.
#   /home/you/sds-content/osha/04_first_aid/inhalation/site_specific.yaml
custom_dir = ""

# The company responsible for the sheet. Feeds section 1, "Supplier details",
# and is named in the sheet's header and footer.
#
# Section 1 requires a name, an address and a telephone number.
[company]
name    = ""
address = ""
phone   = ""
email   = ""

# Emergency telephone contacts. Feeds section 1, "Emergency telephone number".
#
# Add one block per number -- a 24-hour response service, its international
# line, your own site's safety officer. Each renders as one line:
#
#     CHEMTREC (24 hr): 1-800-424-9300 (USA)
#
# "phone" is required; "name" and "note" are optional.
# Delete the leading "# " from the examples below to enable them.

# [[emergency.contacts]]
# name  = "CHEMTREC (24 hr)"
# phone = "1-800-424-9300"
# note  = "USA"

# [[emergency.contacts]]
# name  = "CHEMTREC International"
# phone = "+1-703-527-3887"

# [[emergency.contacts]]
# name  = "Plant safety officer"
# phone = ""                        # <- your own number goes here
# note  = "Mon-Fri 08:00-17:00"

# Your company logo, printed in the sheet header beside the product name.
#
# The size is worked out for you: the artwork is measured and fitted into a
# 50mm x 16mm box with its aspect ratio preserved, and a logo already smaller
# than that box is left alone rather than blown up. The two bounds below only
# adjust that box -- run 'sdsforge config show' to see the size it lands on.
#
# "path" may be absolute, start with ~, or be relative to this file, so a logo
# saved next to config.toml needs only its name. SVG, PNG and JPEG are measured
# exactly; other formats are bounded by the box and left to the renderer.
#
# "alt" is what a screen reader announces; it defaults to your company name.

# [logo]
# path       = "acme-logo.svg"
# max_height = "16mm"
# max_width  = "50mm"
# alt        = ""

# How the finished sheet gets printed.
#
# sdsforge prints through a Chrome-based browser, which is what turns the
# rendered markup into a PDF with a running "Page 3 of 8" footer.
#
# "browser" is only needed when the search fails. Left empty, PATH is searched
# for chromium, chromium-browser, google-chrome, google-chrome-stable, brave,
# brave-browser, microsoft-edge and microsoft-edge-stable, in that order. Set
# it to a path or a name to pin one -- a named browser is never fallen back
# from. Run 'sdsforge config show' to see which one was found.
#
# "paper" is letter, legal, a4 or a5. "margin" applies to all four sides and
# must carry a unit (mm, cm, in, pt or px); the running footer is drawn inside
# it, so it cannot be zero.

# [pdf]
# browser = ""
# paper   = "letter"
# margin  = "0.75in"

# How 'sdsforge document edit' opens a document.
#
# "command" is the editor. Left empty, $VISUAL is tried, then $EDITOR, then a
# built-in default (vi, or notepad on Windows) -- so this is only needed to
# override your environment or to pin something else. A bare name is looked up
# on PATH. Run 'sdsforge config show' to see which editor will actually open.
#
# "args" are passed before the filename. This is the place for anything that
# would need quoting, since each entry is one argument: args = ["-c", "set
# ft=yaml"] rather than command = "nvim -c 'set ft=yaml'".
#
# The file is always re-read afterwards and any parse error reported. "classify"
# and "generate" say what ELSE happens after a successful edit: classify prints
# what the hazard codes now produce, generate re-renders the PDF. Both are also
# available as --classify and --generate for a single run.
#
# "min_duration" is how quickly the editor returning counts as suspicious. A
# graphical editor invoked without its wait flag hands the file to an
# already-running window and exits at once, leaving sdsforge checking a file you
# have not saved yet; the warning is what makes that diagnosable. Set "0" to
# turn it off.

# [edit]
# command      = ""
# args         = []
# classify     = false
# generate     = false
# min_duration = "1s"

# How 'sdsforge cd' launches a shell.
#
# "command" is the shell, and defaults to $SHELL, then /bin/sh (cmd.exe on
# Windows). Set it to run something other than your login shell in a document's
# directory. "args" are passed before anything else.

# [cd]
# command = ""
# args    = []
