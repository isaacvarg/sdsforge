name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # ubuntu-latest ships Chrome, so the browser-backed tests in
      # internal/generation actually print here rather than skipping. They skip
      # rather than fail if that ever stops being true.
      - name: Test
        run: go test ./...
