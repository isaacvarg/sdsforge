name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # -short skips the two tests that start a browser. The runner has a
      # chromium on PATH but cannot launch it ("websocket url timeout
      # reached"), and those tests only skip themselves when no browser is
      # found at all -- a broken one they take at its word. Printing is
      # covered locally, where there is a browser that actually runs.
      - name: Test
        run: go test -short ./...
